stages:
  - build

variables:
  DOCKER_DRIVER: overlay2

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  - |
    if [ "$CI_COMMIT_BRANCH" = "main" ]; then
      export DOCKER_IMAGE_NAME="$CI_REGISTRY_IMAGE:latest"
    else
      export DOCKER_IMAGE_NAME="$CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH"
    fi

include:
  - local: client/demo-nextjs/.gitlab-ci.yml

build:
  image: docker:cli
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker buildx create --use
    - docker buildx inspect --bootstrap
    - docker buildx build --file ./server/c-sharp/docker/Dockerfile --push --tag $DOCKER_IMAGE_NAME ./server/c-sharp