[package]
name = "interstellar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Interstellar chunked uploads for axum: mount a router, implement two hooks."
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["multipart", "json", "tokio"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", features = ["multipart", "json", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
