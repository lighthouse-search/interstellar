stages:
  - build
  - release

build_windows:
  stage: build
  script:
    - cargo build --release --target x86_64-pc-windows-gnu
  artifacts:
    paths:
      - target/x86_64-pc-windows-gnu/release/

build_macos:
  stage: build
  script:
    - cargo build --release --target x86_64-apple-darwin
  artifacts:
    paths:
      - target/x86_64-apple-darwin/release/

build_linux:
  stage: build
  script:
    - cargo build --release --target x86_64-unknown-linux-gnu
  artifacts:
    paths:
      - target/x86_64-unknown-linux-gnu/release/

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - release-cli create --name "Release $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "Release description"
    - release-cli upload --tag-name "$CI_COMMIT_TAG" --name "windows-binary" --url "target/x86_64-pc-windows-gnu/release/your_binary.exe"
    - release-cli upload --tag-name "$CI_COMMIT_TAG" --name "macos-binary" --url "target/x86_64-apple-darwin/release/your_binary"
    - release-cli upload --tag-name "$CI_COMMIT_TAG" --name "linux-binary" --url "target/x86_64-unknown-linux-gnu/release/your_binary"
  only:
    - tags